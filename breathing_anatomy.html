<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500&display=swap');
.baw *{box-sizing:border-box;margin:0;padding:0;}
.baw{background:#f7f3ee;color:#1a1a2e;border-radius:12px;overflow:hidden;border:1px solid rgba(26,26,46,0.1);font-family:'Noto Sans TC',sans-serif;}
.baw-hd{background:#1a1a2e;color:white;padding:13px 18px;display:flex;align-items:center;gap:14px;}
.baw-ey{font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.38);text-transform:uppercase;margin-bottom:3px;}
.baw-title{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:900;letter-spacing:.04em;}
.baw-bb{background:#1a1a2e;padding:7px 18px 10px;display:flex;align-items:center;gap:12px;}
.baw-bbl{font-family:'Noto Serif TC',serif;font-weight:600;font-size:14px;color:white;min-width:36px;}
.baw-bbt{flex:1;height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden;}
.baw-bbf{height:100%;border-radius:2px;width:0%;transition:background .5s;}
.baw-bbp{font-size:11px;color:rgba(255,255,255,.4);min-width:40px;text-align:right;}
.baw-sa{padding:20px 16px 12px;display:flex;justify-content:center;background:#f7f3ee;}
.baw-sa svg{max-width:290px;width:100%;}
/* 三個呼吸按鈕 */
.baw-bc-row{display:flex;gap:8px;padding:0 14px 12px;}
.baw-bc{flex:1;padding:10px 6px;font-size:12px;font-weight:500;text-align:center;border-radius:8px;cursor:pointer;letter-spacing:.04em;font-family:'Noto Sans TC',sans-serif;border:none;transition:all .18s;}
.baw-bc-in{background:#d0eaf4;color:#1a5a72;}
.baw-bc-in.on{background:#4a9ab8;color:white;}
.baw-bc-ex{background:#f0e2cc;color:#7a4a18;}
.baw-bc-ex.on{background:#c87941;color:white;}
.baw-bc-loop{background:rgba(26,26,46,.08);color:#1a1a2e;}
.baw-bc-loop.on{background:#1a1a2e;color:white;}
/* 部位按鈕 */
.baw-ps{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;}
.baw-pb{flex:1;min-width:calc(33.33% - 4px);padding:7px 4px;font-size:11px;text-align:center;border:1px solid rgba(26,26,46,.12);border-radius:8px;cursor:pointer;color:#6a6a7e;background:transparent;transition:all .15s;letter-spacing:.02em;font-family:'Noto Sans TC',sans-serif;}
.baw-pb.on{background:#1a1a2e;color:white;border-color:#1a1a2e;}
.baw-pb:hover:not(.on){background:rgba(26,26,46,.05);}
/* 資訊卡 */
.baw-card{background:white;margin:0 12px 14px;border-radius:10px;padding:18px 16px;border:1px solid rgba(26,26,46,.06);}
.baw-cey{font-size:10px;letter-spacing:.14em;color:#d46b4b;text-transform:uppercase;margin-bottom:6px;}
.baw-cn{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;line-height:1.2;margin-bottom:2px;}
.baw-cen{font-size:12px;color:#8a8a99;letter-spacing:.05em;margin-bottom:4px;}
.baw-crole{font-size:12px;color:#d46b4b;font-weight:500;letter-spacing:.03em;margin-bottom:14px;}
.baw-ch3{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8a8a99;margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid rgba(26,26,46,.07);}
.baw-cp{font-size:13px;line-height:1.85;color:#1a1a2e;}
.baw-yoga{background:#f7f3ee;border-left:3px solid #d46b4b;padding:12px 14px;border-radius:0 8px 8px 0;margin-top:12px;}
.baw-yoga strong{display:block;font-size:10px;letter-spacing:.08em;color:#d46b4b;margin-bottom:4px;}
.baw-yoga p{font-size:13px;line-height:1.75;color:#1a1a2e;}
.baw-note{background:#1a1a2e;color:rgba(255,255,255,.88);padding:13px 15px;border-radius:8px;margin-top:12px;font-size:12.5px;line-height:1.78;}
.baw-steps{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.baw-step{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.75;}
.baw-step-n{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;margin-top:2px;}
.baw-step-n.in{background:#4a9ab8;}
.baw-step-n.ex{background:#c87941;}
.baw-step-arr{font-size:11px;color:#8a8a99;padding:4px 0 2px;letter-spacing:.03em;}
.baw-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;text-align:center;color:#8a8a99;}
.baw-ph-i{font-size:28px;margin-bottom:8px;opacity:.4;}
.baw-ph p{font-size:13px;line-height:1.65;}
.baw-part{cursor:pointer;transition:opacity .2s;}
.baw-part:hover{opacity:.8;}
.baw-part.active{filter:drop-shadow(0 0 9px rgba(212,107,75,.6));}
</style>

var BAW = {
  inhale:{

    steps:[

    yogaTitle:'瑜伽重點：為什麼要深吸氣，而不只是「吸飽」'
  },
  exhale:{

    steps:[

      {c:'ex',t:'肺組織天生彈性帶動回彈，胸腔體積縮小'},
      {c:'ex',t:'內壓高於大氣壓，氣體被動流出'},
      {c:'ex',t:'（主動）腹肌收縮 → 腹腔壓升 → 推橫膈膜急速上升 → 快速排氣'}

    note:'平靜吐氣是完全被動的——肌肉甚麼都不用做，肺靠自身彈性完成。主動吐氣（說話、唱歌、Kapalabhati）才需要腹肌介入。這也是為什麼吐氣比吸氣更容易放鬆：它本來就不用力。',

    body:'橫膈膜是一片穹頂型骨骼肌，分隔胸腔與腹腔。吸氣時圓頂主動收縮下壓，胸腔上下徑增加 1.5–3 公分，形成壓差吸入空氣。這個動作貢獻 70–80% 的吸氣工作量。呼氣時完全放鬆上升，肺靠彈性回彈排氣。長期壓力或久坐讓橫膈膜習慣停在高位，頸部斜角肌被迫代償，導致慢性頸肩緊繃。',
    yoga:'腹式呼吸練習的核心是感受橫膈膜充分下壓，而不是用力擴胸或聳肩。深呼吸能降低皮質醇，正是橫膈膜透過迷走神經刺激副交感系統——每一次正確的深呼吸，都是在主動重設神經系統的壓力狀態。',
    yogaTitle:'瑜伽連結：腹式呼吸 / Ujjayi / 迷走神經刺激'
  },

var bawMode='idle',bawEp=0,bawTransStart=null,bawTransFrom=0,bawTargetEp=0;
var bawLoopPhase='inhale',bawLoopTime=0,bawLoopLast=null;
var bawCurSel=null;
var TRANS=800,INHALE=4000,EXHALE=4000,PAUSE=600;

function bawApplyEp(ep){
  bawEp=ep;
  var e=ep<0.5?2*ep*ep:-1+(4-2*ep)*ep;
  var diaph=document.getElementById('baw-diaph');
  var ll=document.getElementById('baw-lung-l'),lr=document.getElementById('baw-lung-r');
  var ab=document.getElementById('baw-abs'),pv=document.getElementById('baw-pelv');
  var rb=document.getElementById('baw-ribs');
  if(diaph)diaph.style.transform='translateY('+(e*16)+'px)';
  if(ll)ll.style.transform='scale('+(1+e*0.09)+')';
  if(lr)lr.style.transform='scale('+(1+e*0.09)+')';
  if(ab)ab.style.transform='translateY('+(e*9)+'px)';
  if(pv)pv.style.transform='translateY('+(e*5)+'px)';
  if(rb)rb.style.transform='scaleX('+(1+e*0.05)+')';
  var fill=document.getElementById('baw-fill');
  if(fill){fill.style.width=(ep*100)+'%';fill.style.background=ep>0.4?'#7eb8c9':'#c9a87e';}
}

function bawSetArrows(isIn){
  var ad=document.getElementById('baw-ad'),
      all=document.getElementById('baw-all'),alr=document.getElementById('baw-alr'),
      aa=document.getElementById('baw-aa'),ap=document.getElementById('baw-ap');
  if(isIn){
    if(ad){ad.setAttribute('x1',160);ad.setAttribute('y1',300);ad.setAttribute('x2',160);ad.setAttribute('y2',316);}
    if(all){all.setAttribute('x1',80);all.setAttribute('y1',192);all.setAttribute('x2',62);all.setAttribute('y2',192);}
    if(alr){alr.setAttribute('x1',240);alr.setAttribute('y1',192);alr.setAttribute('x2',258);alr.setAttribute('y2',192);}
    if(aa){aa.setAttribute('x1',160);aa.setAttribute('y1',368);aa.setAttribute('x2',160);aa.setAttribute('y2',383);}
    if(ap){ap.setAttribute('x1',160);ap.setAttribute('y1',420);ap.setAttribute('x2',160);ap.setAttribute('y2',434);}
  } else {
    if(ad){ad.setAttribute('x1',160);ad.setAttribute('y1',316);ad.setAttribute('x2',160);ad.setAttribute('y2',300);}
    if(all){all.setAttribute('x1',62);all.setAttribute('y1',192);all.setAttribute('x2',80);all.setAttribute('y2',192);}
    if(alr){alr.setAttribute('x1',258);alr.setAttribute('y1',192);alr.setAttribute('x2',240);alr.setAttribute('y2',192);}
    if(aa){aa.setAttribute('x1',160);aa.setAttribute('y1',383);aa.setAttribute('x2',160);aa.setAttribute('y2',368);}
    if(ap){ap.setAttribute('x1',160);ap.setAttribute('y1',434);ap.setAttribute('x2',160);ap.setAttribute('y2',420);}
  }
}

function bawBtnState(active){
  ['baw-btn-in','baw-btn-ex','baw-btn-loop'].forEach(function(id){
    document.getElementById(id).classList.remove('on');
  });
  if(active)document.getElementById(active).classList.add('on');
}

function bawPhaseBtn(phase){
  var isIn=(phase==='inhale');
  bawMode=isIn?'to-inhale':'to-exhale';
  bawTargetEp=isIn?1:0;
  bawTransFrom=bawEp;
  bawTransStart=null;
  bawLoopLast=null;
  bawBtnState(isIn?'baw-btn-in':'baw-btn-ex');
  var lbl=document.getElementById('baw-lbl'),pht=document.getElementById('baw-ph-txt');
  if(lbl)lbl.textContent=isIn?'吸氣':'吐氣';
  if(pht)pht.textContent=isIn?'吸氣狀態':'吐氣狀態';
  document.getElementById('baw-arrows').style.opacity='1';
  bawSetArrows(isIn);
  bawShowCard(phase);
  requestAnimationFrame(bawAnimate);
}

function bawLoopBtn(){
  var btn=document.getElementById('baw-btn-loop');
  if(bawMode==='loop'){
    bawMode='idle';
    bawBtnState(null);
    bawApplyEp(0);
    document.getElementById('baw-arrows').style.opacity='0';
    var lbl=document.getElementById('baw-lbl'),pht=document.getElementById('baw-ph-txt');
    if(lbl)lbl.textContent='—';if(pht)pht.textContent='選擇模式';
  } else {
    bawMode='loop';bawLoopPhase='inhale';bawLoopTime=0;bawLoopLast=null;
    bawBtnState('baw-btn-loop');
    document.getElementById('baw-arrows').style.opacity='1';
    requestAnimationFrame(bawAnimate);
  }
}

function bawAnimate(ts){
  if(bawMode==='idle')return;
  if(bawMode==='to-inhale'||bawMode==='to-exhale'){
    if(!bawTransStart)bawTransStart=ts;
    var elapsed=ts-bawTransStart;
    var p=Math.min(elapsed/TRANS,1);
    var pe=p<0.5?2*p*p:-1+(4-2*p)*p;
    bawApplyEp(bawTransFrom+(bawTargetEp-bawTransFrom)*pe);
    if(p<1){requestAnimationFrame(bawAnimate);}
    else{bawApplyEp(bawTargetEp);bawMode=bawTargetEp>0.5?'inhale-hold':'exhale-hold';}
    return;
  }
  if(bawMode==='inhale-hold'||bawMode==='exhale-hold')return;
  if(bawMode==='loop'){
    if(!bawLoopLast)bawLoopLast=ts;
    var dt=ts-bawLoopLast;bawLoopLast=ts;bawLoopTime+=dt;
    var lbl=document.getElementById('baw-lbl'),pht=document.getElementById('baw-ph-txt');
    var ep;
    if(bawLoopPhase==='inhale'){
      ep=Math.min(bawLoopTime/INHALE,1);
      if(lbl)lbl.textContent='吸氣';if(pht)pht.textContent='吸…';
      bawSetArrows(true);
      if(bawLoopTime>=INHALE){bawLoopPhase='exhale';bawLoopTime=0;}
    } else if(bawLoopPhase==='exhale'){
      ep=1-Math.min(bawLoopTime/EXHALE,1);
      if(lbl)lbl.textContent='吐氣';if(pht)pht.textContent='吐…';
      bawSetArrows(false);
      if(bawLoopTime>=EXHALE){bawLoopPhase='pause';bawLoopTime=0;}
    } else {
      ep=0;if(lbl)lbl.textContent='—';if(pht)pht.textContent='';
      if(bawLoopTime>=PAUSE){bawLoopPhase='inhale';bawLoopTime=0;}
    }
    bawApplyEp(ep);
    requestAnimationFrame(bawAnimate);
  }
}

function bawShowCard(id){
  var d=BAW[id];if(!d)return;
  var card=document.getElementById('baw-card');
  var html='<div class="baw-cey">'+d.ey+'</div>'
    +'<div class="baw-cn">'+d.name+'</div>'
    +'<div class="baw-cen">'+d.en+'</div>'
    +'<div class="baw-crole">'+d.role+'</div>';
  if(d.steps){
    html+='<div class="baw-ch3">波義耳定律 — 呼吸邏輯</div><div class="baw-steps">';
    d.steps.forEach(function(s,i){
      html+='<div class="baw-step"><span class="baw-step-n '+s.c+'">'+(i+1)+'</span><span>'+s.t+'</span></div>';
      if(i<d.steps.length-1)html+='<div class="baw-step-arr">↓</div>';
    });
    html+='</div>';
    html+='<div class="baw-note">'+d.note+'</div>';
  } else {
    html+='<div class="baw-ch3">機制說明</div><p class="baw-cp">'+d.body+'</p>';
  }
  html+='<div class="baw-yoga"><strong>'+d.yogaTitle+'</strong><p>'+d.yoga+'</p></div>';
  card.innerHTML=html;
}

function bawSelect(id){
  bawCurSel=id;
  document.querySelectorAll('.baw-pb').forEach(function(b){b.classList.remove('on');});
  var pb=document.getElementById('baw-pb-'+id);if(pb)pb.classList.add('on');
  document.querySelectorAll('.baw-part').forEach(function(p){p.classList.remove('active');});
  var svgMap={diaphragm:'baw-diaph',ribs:['baw-ribs','baw-lung-l','baw-lung-r'],abs:'baw-abs',pelvic:'baw-pelv'};
  var t=svgMap[id];
  if(t){
    if(Array.isArray(t)){t.forEach(function(x){var el=document.getElementById(x);if(el)el.classList.add('active');});}
    else{var el=document.getElementById(t);if(el)el.classList.add('active');}
  }
  bawShowCard(id);
}
</script>
